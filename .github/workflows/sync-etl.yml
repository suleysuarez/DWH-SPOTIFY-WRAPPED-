name: Sincronizar ETL

on:
  schedule:
    # Cada hora en el minuto 17: las horas en punto y las medias son las más congestionadas en GitHub
    # y las tareas se retrasan o se omiten más. Aun así, GitHub no garantiza la hora exacta.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-etl
  cancel-in-progress: false

jobs:
  sync:
    environment: SECRETS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Ejecutar ETL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python backend/scripts/sync_etl.py
